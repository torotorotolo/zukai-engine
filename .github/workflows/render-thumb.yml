name: render-thumb

# サムネイルだけを焼く。本編(render-jiko)は1巡3分半かかるので、
# サムネの試行はこちらで回す（30秒ほどで終わる）。
# 🔴 レンダリングはクラウドのみ（ローカルPCはメモリ4GB）。

on:
  workflow_dispatch:
    inputs:
      note:
        description: "この巡で何を直したか（成果物名に入る）"
        required: false
        default: ""

jobs:
  thumb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            sudo apt-get update && sudo apt-get install -y chromium-browser
            chromium-browser --version
          fi

      - name: Bake thumbnails
        run: python tools/thumb_jiko.py

      # 検品用に「一覧」と「スマホ相当（幅246px）」を並べて出す。
      # サムネは実際には小さく表示されるので、**縮小しても読めるか**が本番の判定基準。
      - name: Contact sheet + phone size
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          d = Path("out/thumb")
          ims = sorted(p for p in d.glob("*.png") if not p.stem.startswith("_"))
          if ims:
              sh = Image.new("RGB", (1280, 720 * len(ims)), "#000")
              ph = Image.new("RGB", (246 * len(ims) + 20 * (len(ims) - 1), 138), "#181818")
              for i, p in enumerate(ims):
                  im = Image.open(p).convert("RGB")
                  sh.paste(im, (0, i * 720))
                  ph.paste(im.resize((246, 138), Image.LANCZOS), (i * 266, 0))
              sh.save(d / "_all.jpg", quality=92)
              ph = ph.resize((ph.width * 2, ph.height * 2), Image.LANCZOS)
              ph.save(d / "_phone.png")
              print("並べた", [p.name for p in ims])
          PY
          ls -la out/thumb/

      - uses: actions/upload-artifact@v4
        with:
          name: jiko-thumb${{ inputs.note && format('-{0}', inputs.note) || '' }}
          path: out/thumb/
