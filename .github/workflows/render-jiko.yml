name: render-jiko

# 🔴 レンダリングはクラウドのみ（2026-07-29 カズヤくん指示）。
#    SVG→PNG のレイヤー書き出しも、PNG→mp4 の合成も、**両方ここで実行する**。
#    ローカルPCはメモリ4GB。ローカルでは焼かない。
#
# ■ 2つのモード（本編は226カット・34分06秒＝61,300コマある）
#    qa   … 検品用の静止画・拡大図・章ごとの一覧だけを作る（既定）。**精査はこれを回す**
#    full … mp4 まで作る。カット単位で並列に焼いて連結し、音声を乗せる

on:
  workflow_dispatch:
    inputs:
      note:
        description: "この巡で何を直したか（成果物名に入る）"
        required: false
        default: ""
      mode:
        description: "qa（検品画像だけ・速い）／ full（mp4まで）"
        required: false
        default: "qa"
        type: choice
        options: ["qa", "full"]
      zoom:
        description: "拡大図を出すカット（例 c114,c529）。空なら章ごとの代表だけ"
        required: false
        default: ""
      partial:
        description: "画を作っている途中（未定義カットを飛ばして焼く）"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 描画は Chrome headless。ubuntu-latest には google-chrome が入っている。
      - name: Ensure Chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            sudo apt-get install -y chromium-browser
            chromium-browser --version
          fi

      # 226カット全部に「画」が割り当たっているか。抜けがあればここで止める。
      # ⚠️ partial=true のときは抜けを見逃す（章を作っている途中の試し焼き用）。
      - name: Check cut table
        continue-on-error: ${{ inputs.partial == 'true' }}
        run: python tools/scene_jiko.py --report

      # 🔴 焼く前に机上で字幅を検算する（フォントから実測）。
      #    画面外・重なり・豆腐はここで分かるので、レンダリングを待たずに読める。
      #    ⚠️ 失敗しても続行する（検品画像は見たいので）。ログは必ず読むこと。
      - name: Check layout (机上の検算)
        continue-on-error: true
        run: python tools/check_layout.py

      - name: Render layers (SVG -> PNG)
        run: python tools/scene_jiko.py --force

      - name: Build QA stills
        run: |
          ARGS="qa"
          [ "${{ inputs.partial }}" = "true" ] && ARGS="$ARGS --partial"
          [ -n "${{ inputs.zoom }}" ] && ARGS="$ARGS --zoom=${{ inputs.zoom }}"
          python tools/build_jiko.py $ARGS

      # 画面の余白を機械で測る。基準は _empty.png（地だけを焼いたもの）との画素差。
      # ⚠️ **必ず JPEG に詰め直す前に**やる（JPEGのノイズが地との差として出るため）。
      - name: Check whitespace
        continue-on-error: true
        run: python tools/check_space.py out/jiko/qa

      - name: Shrink stills for download
        run: python tools/build_jiko.py shrink

      # ── ここから下は mode=full のときだけ ──
      # ナレーションはローカルの AivisSpeech で作り、opus に詰めて置いてある
      # （wav のままだと1本163MB。git は履歴を消せないので作り直すたび積み上がる）。
      - name: Unpack narration (opus -> wav)
        if: inputs.mode == 'full'
        run: |
          python tools/audio_pack.py check
          python tools/audio_pack.py unpack

      - name: Composite (PNG -> mp4)
        if: inputs.mode == 'full'
        run: python tools/build_jiko.py full

      # BGM と効果音はここで合成する（既製音源を public リポジトリに置かないため）
      - name: Mix narration + BGM + SE
        if: inputs.mode == 'full'
        run: |
          python tools/audio_mix.py
          ffmpeg -y -hide_banner -loglevel error \
            -i out/jiko/titan.mp4 -i out/jiko/mix.wav \
            -c:v copy -c:a aac -b:a 192k -shortest out/jiko/titan_audio.mp4
          ls -la out/jiko/*.mp4 out/jiko/mix.wav

      - name: Summary
        run: |
          ls out/jiko/qa/ | head -40
          echo "--- qa の枚数と容量 ---"
          ls out/jiko/qa | wc -l
          du -sh out/jiko/qa
          if [ -f out/jiko/titan.mp4 ]; then
            echo "--- 映像 ---"
            ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate \
              -of json out/jiko/titan.mp4
            echo "--- 音声入り（これを上げる） ---"
            ffprobe -v error -show_entries format=duration -of default=nw=1 \
              out/jiko/titan_audio.mp4
            du -h out/jiko/titan_audio.mp4 out/jiko/titan.mp4
          fi

      # 検品はここに上がった **クラウド出力** だけを見る。
      # ローカルのフォントと折返し位置が変わった実績があるため。
      # ⚠️ **retention-days を必ず付ける。** ここが実際に効いてくる制限。
      #    public リポジトリなので実行時間は無料で上限が無いが、
      #    **成果物ストレージはアカウント共通で 500MB しかない**。
      #    テスト映像23巡＋サムネ8巡で 57件・1.02GB まで積み上がっていた（無料枠の2倍）。
      #    本編は226カットあり qa だけで1巡100MB前後になるので、消さないと5巡で枠を割る。
      #    巡が終わって中身を見たら `python tools/gc_artifacts.py --keep 4` で掃除する。
      - uses: actions/upload-artifact@v4
        with:
          name: jiko-qa${{ inputs.note && format('-{0}', inputs.note) || '' }}
          path: out/jiko/qa/
          retention-days: 5

      # ⚠️ 34分の mp4 は数百MB〜1GB になりうる。**成果物ストレージは500MBしかない**ので
      #    音声入りの1本だけを上げ、保持も2日に縮める。
      #    映像だけの titan.mp4 は音声入りから作り直せるので上げない。
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'full'
        with:
          name: jiko-mp4${{ inputs.note && format('-{0}', inputs.note) || '' }}
          path: out/jiko/titan_audio.mp4
          retention-days: 2
