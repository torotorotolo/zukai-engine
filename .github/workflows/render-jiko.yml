name: render-jiko

# 🔴🔴 **ここでは本編mp4を焼かない**（2026-07-31 決定）。
#
#   GitHub の Terms for Additional Products and Features（Actions の節）は、
#   GitHub-hosted runner を「そのリポジトリのソフトウェアプロジェクトの
#   production / testing / deployment / publication と無関係な活動」に
#   使うことを禁じている。「便益に不釣り合いな負荷」も禁止列挙にある。
#
#     - レンダラを**試すために数フレーム焼く**のは白
#     - **YouTubeに出す本編34分・61,320コマを毎本焼く**のは、
#       成果物が動画でありソフトウェアではない以上、黒
#
#   2026年3月、Actions を CI 以外の汎用計算に使った個人が
#   **永久BAN＋データ取り出し不可**という報告がある。
#   ⚠️ 同一アカウント群に 深読みフクロウ・スカッと・健康スレ集・漂着日記 が載っている。
#      BANの影響は動画1本ではなく、**全チャンネルの制作基盤**。
#
#   → **本編の製造は Modal で回す。`modal_app.py` を読むこと。**
#        modal run modal_app.py::full --note r10
#        modal volume get jiko-out titan_audio.mp4 out/jiko/
#
#   ここに残してよいのは **検品画像（qa）と機械検査だけ**。
#   mode=full は入力そのものを消してあるので、うっかり回せない。

on:
  workflow_dispatch:
    inputs:
      note:
        description: "この巡で何を直したか（成果物名に入る）"
        required: false
        default: ""
      mode:
        description: "qa のみ。🔴 本編mp4は Modal で焼く（modal_app.py）"
        required: false
        default: "qa"
        type: choice
        options: ["qa"]
      zoom:
        description: "拡大図を出すカット（例 c114,c529）。空なら章ごとの代表だけ"
        required: false
        default: ""
      partial:
        description: "画を作っている途中（未定義カットを飛ばして焼く）"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 🔴 mode に qa 以外が来たら止める。choice で弾いているが、
      #    API を直接叩けば通せてしまうので二重に止める。
      - name: Refuse anything but qa
        if: inputs.mode != 'qa'
        run: |
          echo "::error::本編mp4を Actions で焼くのは規約違反。modal_app.py で焼くこと。"
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 描画は Chrome headless。ubuntu-latest には google-chrome が入っている。
      # ⚠️ Modal 側も **ubuntu:24.04 + google-chrome-stable** で揃えてある。
      #    画が一致しているかは下の「Layer fingerprint」で確かめる。
      - name: Ensure Chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            sudo apt-get install -y chromium-browser
            chromium-browser --version
          fi

      # ★実写「動画」を落として、必要なコマだけ切り出す（2026-08-01 追加）。
      #   🔴 動画はリポジトリに入れていないので、ここで URL から取る。
      #   ⚠️ 失敗しても続行する。コマが無ければ build 側は**静止画に落ちる**ので、
      #     素材が取れない日でも検品は回せる（パイプラインは壊れない）。
      - name: Fetch footage (実写動画)
        continue-on-error: true
        run: python tools/footage.py

      # 226カット全部に「画」が割り当たっているか。抜けがあればここで止める。
      # ⚠️ partial=true のときは抜けを見逃す（章を作っている途中の試し焼き用）。
      - name: Check cut table
        continue-on-error: ${{ inputs.partial == 'true' }}
        run: python tools/scene_jiko.py --report

      # 🔴 焼く前に机上で字幅を検算する（フォントから実測）。
      #    画面外・重なり・豆腐はここで分かるので、レンダリングを待たずに読める。
      #    ⚠️ 失敗しても続行する（検品画像は見たいので）。ログは必ず読むこと。
      - name: Check layout (机上の検算)
        continue-on-error: true
        run: python tools/check_layout.py

      # 図がナレーションの複写になっていないか（映像ルール6）
      - name: Check echo
        continue-on-error: true
        run: python tools/check_echo.py

      # ★語尾が BGM に埋もれていないか（2026-07-31 の試写指摘①で追加）。
      #   opus を wav に戻さないと測れないので、ここで展開する。
      #   ⚠️ これは**検査**であって製造ではない（mp4 は作らない）。
      - name: Check narration under BGM
        continue-on-error: true
        run: |
          python tools/audio_pack.py check
          python tools/audio_pack.py unpack
          python tools/check_mask.py

      - name: Render layers (SVG -> PNG)
        run: python tools/scene_jiko.py --force

      # ★Modal と画が一致しているかを突き合わせるための指紋。
      #   `modal run modal_app.py::layer_hash` が同じ値を出す。
      #   ここがずれたら、Actions で見た検品9巡は Modal の本編に対して無効。
      - name: Layer fingerprint
        run: python tools/layer_hash.py

      - name: Build QA stills
        run: |
          ARGS="qa"
          [ "${{ inputs.partial }}" = "true" ] && ARGS="$ARGS --partial"
          [ -n "${{ inputs.zoom }}" ] && ARGS="$ARGS --zoom=${{ inputs.zoom }}"
          python tools/build_jiko.py $ARGS

      # 画面の余白を機械で測る。基準は _empty.png（地だけを焼いたもの）との画素差。
      # ⚠️ **必ず JPEG に詰め直す前に**やる（JPEGのノイズが地との差として出るため）。
      - name: Check whitespace
        continue-on-error: true
        run: python tools/check_space.py out/jiko/qa

      - name: Shrink stills for download
        run: python tools/build_jiko.py shrink

      - name: Summary
        run: |
          ls out/jiko/qa/ | head -40
          echo "--- qa の枚数と容量 ---"
          ls out/jiko/qa | wc -l
          du -sh out/jiko/qa

      # 検品はここに上がった **クラウド出力** だけを見る。
      # ローカルのフォントと折返し位置が変わった実績があるため。
      # ⚠️ **retention-days を必ず付ける。** ここが実際に効いてくる制限。
      #    public リポジトリなので実行時間は無料で上限が無いが、
      #    **成果物ストレージはアカウント共通で 500MB しかない**。
      #    巡が終わって中身を見たら `python tools/gc_artifacts.py --keep 2` で掃除する。
      - uses: actions/upload-artifact@v4
        with:
          name: jiko-qa${{ inputs.note && format('-{0}', inputs.note) || '' }}
          path: out/jiko/qa/
          retention-days: 5
