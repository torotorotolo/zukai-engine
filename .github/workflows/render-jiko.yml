name: render-jiko

# 🔴 レンダリングはクラウドのみ（2026-07-29 カズヤくん指示）。
#    SVG→PNG のレイヤー書き出しも、PNG→mp4 の合成も、**両方ここで実行する**。
#    ローカルPCはメモリ4GB。ローカルでは焼かない。

on:
  workflow_dispatch:
    inputs:
      note:
        description: "この巡で何を直したか（成果物名に入る）"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 描画は Chrome headless。ubuntu-latest には google-chrome が入っている。
      # 無ければ chromium を入れる（render.py が両方を探す実装）。
      - name: Ensure Chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            sudo apt-get install -y chromium-browser
            chromium-browser --version
          fi

      # フォントは woff2 を base64 で SVG に埋め込むので、システムフォントには依存しない。
      # それでも豆腐が出たら分かるように、書き出した PNG を必ず検品用に上げる。
      - name: Render layers (SVG -> PNG)
        run: python tools/scene_jiko.py --force

      - name: Composite (PNG -> mp4)
        run: python tools/build_jiko.py

      # 音声。ナレーションはローカルの AivisSpeech で作り、**opus に詰めて**置いてある。
      # wav のままだと1本で163MBあり、作り直すたびに git の履歴に積み上がるため
      # （2026-07-31 決定。詳細は tools/audio_pack.py の冒頭）。
      # ここで wav に戻すので、audio_mix.py 側は何も変わらない。
      - name: Unpack narration (opus -> wav)
        run: |
          python tools/audio_pack.py check
          python tools/audio_pack.py unpack

      # BGM と効果音はここで合成する（既製音源を public リポジトリに置かないため）
      - name: Mix narration + BGM + SE
        run: |
          python tools/audio_mix.py
          ffmpeg -y -hide_banner -loglevel error \
            -i out/jiko/jiko_test.mp4 -i out/jiko/mix.wav \
            -c:v copy -c:a aac -b:a 192k -shortest out/jiko/jiko_test_audio.mp4
          ls -la out/jiko/*.mp4 out/jiko/mix.wav

      # 画面の余白を機械で測る（2026-07-30）。目視だけだと「詰めたつもり」で終わるので、
      # 占有率と最大の空き矩形を必ずログに出す。基準は qa/_empty.png（地だけを焼いたもの）。
      - name: Check whitespace
        run: python tools/check_space.py out/jiko/qa

      - name: Summary
        run: |
          ls -la out/jiko/*.mp4
          ls out/jiko/qa/
          python - <<'PY'
          import subprocess, json
          p = subprocess.run(["ffprobe","-v","error","-show_entries",
                              "format=duration:stream=width,height,r_frame_rate",
                              "-of","json","out/jiko/jiko_test.mp4"],
                             capture_output=True, text=True)
          print(p.stdout)
          PY

      # 検品はここに上がった **クラウド出力** だけを見る。
      # ローカルのWindowsフォントと折返し位置が変わった実績があるため。
      - uses: actions/upload-artifact@v4
        with:
          name: jiko-qa${{ inputs.note && format('-{0}', inputs.note) || '' }}
          path: out/jiko/qa/

      - uses: actions/upload-artifact@v4
        with:
          name: jiko-mp4${{ inputs.note && format('-{0}', inputs.note) || '' }}
          path: |
            out/jiko/jiko_test_audio.mp4
            out/jiko/jiko_test.mp4
